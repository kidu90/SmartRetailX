apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalogue-service
  labels:
    app: catalogue-service
    app.kubernetes.io/name: catalogue-service
    app.kubernetes.io/part-of: smartretailx
spec:
  podSelector:
    matchLabels:
      app: catalogue-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway (external clients) and order-service (product lookup)
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - protocol: TCP
          port: 3002
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
