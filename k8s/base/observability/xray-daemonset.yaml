apiVersion: v1
kind: ServiceAccount
metadata:
  name: xray-daemon
  namespace: amazon-cloudwatch
  annotations:
    # Patch after terraform: terraform -chdir=infra/envs/dev output -raw xray_daemon_role_arn
    eks.amazonaws.com/role-arn: ""
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xray-daemon
  namespace: amazon-cloudwatch
  labels:
    app.kubernetes.io/name: xray-daemon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: xray-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xray-daemon
    spec:
      serviceAccountName: xray-daemon
      containers:
        - name: xray-daemon
          image: public.ecr.aws/xray/aws-xray-daemon:latest
          command: ["/usr/bin/xray", "-t", "0.0.0.0:2000", "-b", "0.0.0.0:2000"]
          ports:
            - containerPort: 2000
              hostPort: 2000
              protocol: UDP
              name: xray-ingest
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 20m
              memory: 32Mi
          env:
            - name: AWS_REGION
              value: ap-south-1
---
apiVersion: v1
kind: Service
metadata:
  name: xray-daemon
  namespace: amazon-cloudwatch
spec:
  selector:
    app.kubernetes.io/name: xray-daemon
  ports:
    - port: 2000
      protocol: UDP
      targetPort: 2000
  # Apps reach the daemon via hostIP:2000 (DaemonSet hostPort) or this headless SVC
  clusterIP: None
