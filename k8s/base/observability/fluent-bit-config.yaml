apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Log_Level                 info
        Daemon                    off
        Parsers_File              parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020

    [INPUT]
        Name                      tail
        Tag                       kube.*
        Path                      /var/log/containers/*_smartretailx_*.log
        DB                        /var/fluent-bit/state/flb_kube.db
        Mem_Buf_Limit             25MB
        Skip_Long_Lines           On
        Refresh_Interval          10

    [FILTER]
        Name                      kubernetes
        Match                     kube.*
        Merge_Log                 On
        Keep_Log                  Off
        K8S-Logging.Parser        On
        K8S-Logging.Exclude       Off

    # Route each container into /smartretailx/<app.kubernetes.io/name>
    # Log groups are pre-created by Terraform (14d retention in dev).
    [OUTPUT]
        Name                      cloudwatch_logs
        Match                     kube.*
        region                    ${AWS_REGION}
        log_group_name            /smartretailx/$(kubernetes['labels']['app.kubernetes.io/name'])
        log_stream_prefix         $(kubernetes['pod_name'])-
        auto_create_group         On
        retry_limit               2

  parsers.conf: |
    [PARSER]
        Name                      docker
        Format                    json
        Time_Key                  time
        Time_Format               %Y-%m-%dT%H:%M:%S.%L
        Time_Keep                 On
