apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: smartretailx/user-service
    newTag: dev
  - name: smartretailx/catalogue-service
    newTag: dev
  - name: smartretailx/order-service
    newTag: dev
  - name: smartretailx/gateway
    newTag: dev

replicas:
  - name: user-service
    count: 1
  - name: catalogue-service
    count: 1
  - name: order-service
    count: 1
  - name: gateway
    count: 1

patches:
  - path: patches/resources.yaml
  - path: patches/hpa.yaml
  - path: patches/config.yaml
  - path: patches/ingress.yaml
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: user-service
    path: patches/pdb-json.yaml
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: catalogue-service
    path: patches/pdb-json.yaml
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: order-service
    path: patches/pdb-json.yaml
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: gateway
    path: patches/pdb-json.yaml

labels:
  - pairs:
      environment: dev
    includeSelectors: false
