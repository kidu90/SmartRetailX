apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: smartretailx/user-service
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/smartretailx/user-service
    newTag: "1.0.0"
  - name: smartretailx/catalogue-service
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/smartretailx/catalogue-service
    newTag: "1.0.0"
  - name: smartretailx/order-service
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/smartretailx/order-service
    newTag: "1.0.0"
  - name: smartretailx/gateway
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/smartretailx/gateway
    newTag: "1.0.0"

replicas:
  - name: user-service
    count: 3
  - name: catalogue-service
    count: 3
  - name: order-service
    count: 3
  - name: gateway
    count: 3

patches:
  - path: patches/resources.yaml
  - path: patches/hpa.yaml
  - path: patches/config.yaml
  - path: patches/ingress.yaml
  - path: patches/pdb.yaml
  - path: patches/anti-affinity.yaml

labels:
  - pairs:
      environment: prod
    includeSelectors: false
