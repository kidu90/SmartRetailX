openapi: 3.0.3
info:
  title: SmartRetailX Catalogue Service
  description: CRUD for products and categories, plus search
  version: 1.0.0
servers:
  - url: /api/v1
    description: Versioned API
tags:
  - name: Categories
  - name: Products
  - name: Search
paths:
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        '200':
          description: Category list
    post:
      tags: [Categories]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Created
  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Category
        '404':
          description: Not found
    put:
      tags: [Categories]
      summary: Update category
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Categories]
      summary: Delete category
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
      responses:
        '200':
          description: Product list
    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Created
  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Product
        '404':
          description: Not found
    put:
      tags: [Products]
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Products]
      summary: Delete product
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
  /search:
    get:
      tags: [Search]
      summary: Search products by keyword
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching products
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    ProductInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        categoryId:
          type: string
        sku:
          type: string
        stock:
          type: integer
          minimum: 0
