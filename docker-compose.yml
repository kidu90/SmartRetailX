services:
  user-service:
    build:
      context: ./services/user-service
    container_name: smartretailx-user-service
    environment:
      PORT: 3001
      NODE_ENV: development
      JWT_SECRET: local-dev-jwt-secret-change-me
      JWT_EXPIRES_IN: 15m
      LOG_LEVEL: info
      SERVICE_NAME: user-service
    ports:
      - "3001:3001"
    networks:
      - smartretailx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalogue-service:
    build:
      context: ./services/catalogue-service
    container_name: smartretailx-catalogue-service
    environment:
      PORT: 3002
      NODE_ENV: development
      JWT_SECRET: local-dev-jwt-secret-change-me
      LOG_LEVEL: info
      SERVICE_NAME: catalogue-service
    ports:
      - "3002:3002"
    networks:
      - smartretailx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: smartretailx-inventory-service
    environment:
      PORT: 3005
      NODE_ENV: development
      EVENTING_MODE: http
      EVENT_HTTP_TARGETS: >-
        http://payment-service:3004/internal/events,
        http://notification-service:3006/internal/events,
        http://order-service:3003/internal/events,
        http://inventory-service:3005/internal/events
      LOG_LEVEL: info
      SERVICE_NAME: inventory-service
    ports:
      - "3005:3005"
    networks:
      - smartretailx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-service:
    build:
      context: ./services/payment-service
    container_name: smartretailx-payment-service
    environment:
      PORT: 3004
      NODE_ENV: development
      EVENTING_MODE: http
      EVENT_HTTP_TARGETS: >-
        http://inventory-service:3005/internal/events,
        http://notification-service:3006/internal/events,
        http://order-service:3003/internal/events,
        http://payment-service:3004/internal/events
      LOG_LEVEL: info
    ports:
      - "3004:3004"
    networks:
      - smartretailx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: ./services/notification-service
    container_name: smartretailx-notification-service
    environment:
      PORT: 3006
      NODE_ENV: development
      EVENTING_MODE: http
      LOG_LEVEL: info
      SERVICE_NAME: notification-service
    ports:
      - "3006:3006"
    networks:
      - smartretailx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build:
      context: ./services/order-service
    container_name: smartretailx-order-service
    environment:
      PORT: 3003
      NODE_ENV: development
      JWT_SECRET: local-dev-jwt-secret-change-me
      LOG_LEVEL: info
      SERVICE_NAME: order-service
      CATALOGUE_SERVICE_URL: http://catalogue-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3004
      EVENTING_MODE: http
      EVENT_HTTP_TARGETS: >-
        http://inventory-service:3005/internal/events,
        http://payment-service:3004/internal/events,
        http://notification-service:3006/internal/events,
        http://order-service:3003/internal/events
      EVENT_BUS_ENABLED: "true"
    ports:
      - "3003:3003"
    depends_on:
      catalogue-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - smartretailx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ./gateway
    container_name: smartretailx-gateway
    environment:
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: local-dev-jwt-secret-change-me
      LOG_LEVEL: info
      SERVICE_NAME: gateway
      USER_SERVICE_URL: http://user-service:3001
      CATALOGUE_SERVICE_URL: http://catalogue-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    ports:
      - "3000:3000"
    depends_on:
      user-service:
        condition: service_healthy
      catalogue-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - smartretailx-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin nginx proxy to gateway inside the compose network
        VITE_GATEWAY_URL: ""
        VITE_WS_URL: http://localhost:3006
        VITE_CLOUDWATCH_DASHBOARD_URL: ""
    container_name: smartretailx-frontend
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - smartretailx-net

networks:
  smartretailx-net:
    driver: bridge
    name: smartretailx-net
