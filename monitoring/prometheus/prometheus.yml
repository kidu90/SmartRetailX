global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # When services run on the host (npm start), scrape via host.docker.internal.
  # When services run in docker-compose, attach this stack to smartretailx-net
  # and replace targets with service DNS names (gateway:3000, etc.).
  - job_name: smartretailx
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
          - host.docker.internal:3001
          - host.docker.internal:3002
          - host.docker.internal:3003
          - host.docker.internal:3004
          - host.docker.internal:3005
          - host.docker.internal:3006
        labels:
          platform: smartretailx
